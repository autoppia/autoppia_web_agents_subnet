# SonarCloud analysis for autoppia_web_agents_subnet (repo root layout: requirements.txt, autoppia_web_agents_subnet/, tests/)
name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "bittensor==9.9.0" pytest-cov
          pip install -e . --no-deps

      - name: Audit (pip-audit)
        run: |
          pip install pip-audit
          mkdir -p reports
          pip-audit -f json 2>/dev/null > reports/pip-audit.json || true

      - name: Count (direct deps vulns)
        id: pip_audit
        run: |
          count=$(python .github/scripts/pip_audit_count.py)
          echo "pip_audit_vuln_count=$count" >> "$GITHUB_OUTPUT"
          echo "Direct dependency vulnerabilities: $count"

      - name: List (pip-audit table)
        if: steps.pip_audit.outputs.pip_audit_vuln_count != '0'
        run: pip-audit

      - name: Fail if direct deps have vulnerabilities
        if: steps.pip_audit.outputs.pip_audit_vuln_count != '0'
        run: |
          echo "::error::Dependency vulnerabilities found (pip-audit: ${{ steps.pip_audit.outputs.pip_audit_vuln_count }}). Fix them before merging."
          exit 1

      - name: Run tests with coverage
        env:
          VALIDATOR_NAME: sonar-ci
          VALIDATOR_IMAGE: sonar-ci
        run: |
          pytest tests/ --cov=autoppia_web_agents_subnet --cov-report=xml --cov-report=term -q

      - name: Ensure coverage report exists for SonarCloud
        run: |
          if [ ! -f coverage.xml ]; then
            echo "Creating minimal coverage.xml (tests may have failed)"
            printf '%s\n' '<?xml version="1.0" ?>' '<coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="1" branches-covered="0" branches-valid="0" version="1.9" timestamp="0">' '<sources><source>.</source></sources>' '<packages/>' '</coverage>' > coverage.xml
          fi

      - name: OWASP Dependency-Check (SARIF for SonarCloud)
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600
        with:
          project: "autoppia_web_agents_subnet"
          path: "."
          format: "SARIF"
          out: "reports"
        continue-on-error: true

      - name: Normalize SARIF report for SonarCloud
        id: sarif
        run: |
          mkdir -p reports
          for f in reports/*.sarif; do
            [ -e "$f" ] && cp "$f" reports/dependency-check-report.sarif && break
          done
          if [ -f reports/dependency-check-report.sarif ]; then
            echo "has_sarif=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sarif=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF reports (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: reports/
          retention-days: 5

      - name: Validate SonarCloud config
        id: sonar_cfg
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::warning::SONAR_TOKEN is missing; skipping Sonar scan."
            echo "run_sonar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${SONAR_ORGANIZATION:-}" ]; then
            echo "::error::SONAR_ORGANIZATION repository variable is missing."
            echo "Set Settings -> Secrets and variables -> Actions -> Variables -> SONAR_ORGANIZATION."
            exit 1
          fi
          if [ -z "${SONAR_PROJECT_KEY:-}" ]; then
            echo "::warning::SONAR_PROJECT_KEY variable is missing; defaulting to autoppia-web-agents-subnet."
            echo "SONAR_PROJECT_KEY=autoppia-web-agents-subnet" >> "$GITHUB_ENV"
          else
            echo "SONAR_PROJECT_KEY=${SONAR_PROJECT_KEY}" >> "$GITHUB_ENV"
          fi
          echo "SONAR_ORGANIZATION=${SONAR_ORGANIZATION}" >> "$GITHUB_ENV"
          echo "run_sonar=true" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        if: steps.sonar_cfg.outputs.run_sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'autoppia-web-agents-subnet' }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.branch.name=${{ github.ref_name }}
            ${{ steps.sarif.outputs.has_sarif == 'true' && '-Dsonar.sarifReportPaths=reports/dependency-check-report.sarif' || '' }}
